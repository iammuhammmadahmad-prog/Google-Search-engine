<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="Favicons/Google_Favicon_2025.svg.webp" type="image/x-icon">
    <title>AdvancedSearch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../PROJECT 0/css/styles.css">
    <link rel="stylesheet" href="../PROJECT 0/css/advance-style.css">
</head>

<body>

    <header class="advanced-header">

        <a href="index.html" class="logo small">
            <span>G</span>
            <span>o</span>
            <span>o</span>
            <span>g</span>
            <span>l</span>
            <span>e</span>
        </a>

        <nav class="google-nav">
            <div class="google-nav-links">

                <a href="images.html">Images</a>

                <a href="https://accounts.google.com/ServiceLogin?hl=en" class="btn-signin">
                    Sign in
                </a>

            </div>
        </nav>

    </header>

    <main class="advanced-content">

        <h2 class="advanced-title">
            Advanced Search
        </h2>


        <div class="advanced-container">

            <form action="https://www.google.com/search" method="GET">

                <div class="form-row">
                    <label for="as_q">All these words:</label>
                    <input type="text" id="as_q" name="as_q" class="advanced-input">
                </div>

                <div class="form-row">
                    <label for="as_epq">This exact word or phrase:</label>
                    <input type="text" id="as_epq" name="as_epq" class="advanced-input">
                </div>

                <div class="form-row">
                    <label for="as_oq">Any of these words:</label>
                    <input type="text" id="as_oq" name="as_oq" class="advanced-input">
                </div>

                <div class="form-row">
                    <label for="as_eq">None of these words:</label>
                    <input type="text" id="as_eq" name="as_eq" class="advanced-input">
                </div>
                <div class="form-row">
                    <label for="as_sitesearch">Site or domain:</label>
                    <input type="text" id="as_sitesearch" name="as_sitesearch" class="advanced-input"
                        placeholder="example.com">
                </div>

                <div class="button-row">
                    <input type="submit" value="Advanced Search" class="btn-advanced">
                </div>

            </form>

        </div>
</body>
