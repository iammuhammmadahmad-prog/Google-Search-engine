<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="Favicons/Google_Favicon_2025.svg.webp" type="image/x-icon">
    <title>Google Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../PROJECT 0/css/styles.css">
</head>

<body>
    <!-- Top-right navigation -->
    <nav class="google-nav">
        <div class="google-nav-links">

            <a href="images.html">Images</a>

            <a href="advanced.html">Advanced Search</a>

            <a href="https://about.google/products/" target="_blank" rel="noopener noreferrer" class="icon-link"
                aria-label="Google apps">
                <i class="bi bi-grid-3x3-gap-fill"></i>
            </a>

            <a href="https://accounts.google.com/ServiceLogin?hl=en" class="btn-signin">
                Sign in
            </a>

        </div>
    </nav>

    <!-- Centered search area -->
    <main class="search-page">
        <h1 class="logo">
            <span>G</span>
            <span>o</span>
            <span>o</span>
            <span>g</span>
            <span>l</span>
            <span>e</span>
        </h1>
        <form action="https://www.google.com/search" class="search-form">
            <div class="search-container">
                <div class="search-wrapper">
                    <i class="bi bi-search search-icon" onclick="this.closest('form').submit()" style="cursor: pointer;"></i>
                    <input class="search-input" type="text" name="q" autofocus>
                    <i class="bi bi-mic-fill search-voice" onclick="const recognition = new webkitSpeechRecognition();
recognition.lang = 'en-US';

recognition.onresult = function(event) {
    document.querySelector('.search-input').value =
        event.results[0][0].transcript;
};

document.querySelector('.search-voice').onclick = function () {
    recognition.start();
};" " ></i>
                    <i class="bi bi-camera search-camera"></i>
                </div>
            </div>
            <div class="button-row">
                <input type="submit" class="btn-google-search" value="Google Search">
                <input type="submit" class="btn-google-search" name="btnI" value="I'm Feeling Lucky">
            </div>
        </form>
    </main>
</body>

</html>
